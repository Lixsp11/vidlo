[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]  # pybind11 3.0 起支持 Python 3.14
build-backend = "scikit_build_core.build"

[project]
name = "vidlo"
version = "0.1"
description = "GPU video frame reader: NVDEC decoding, CV-CUDA crop/convert/resize, local and object storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# 读对象存储时才需要；只读本地文件的环境不必安装。关闭或超时时靠 urllib3 的 HTTPResponse.shutdown() 打断读取，
# 2.5 起它不会打断已归还连接池、被别的请求复用的连接
s3 = ["boto3>=1.36", "urllib3>=2.5"]
oss = ["alibabacloud-oss-v2>=1.4", "urllib3>=2.5"]

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.packages = ["src/vidlo"]
build-dir = "build/{wheel_tag}"

# 发布用的 wheel（.github/workflows/release.yml）：manylinux_2_28 容器里先用 ci/build_deps.sh 准备依赖，
# auditwheel 把 FFmpeg、CV-CUDA 的库改名后拷进包里；libcuda、libnvcuvid 用部署环境的驱动库，不打包
[tool.cibuildwheel]
build = ["cp311-manylinux_x86_64", "cp312-manylinux_x86_64", "cp313-manylinux_x86_64", "cp314-manylinux_x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "bash ci/build_deps.sh"
# 构建机没有 GPU 驱动：用占位库让扩展模块能加载，只检查导入（导入时不初始化 CUDA）
test-command = "LD_LIBRARY_PATH=/opt/stubs python -c 'import vidlo; print(vidlo.__version__)'"

[tool.cibuildwheel.linux]
environment = { PATH = "/usr/local/cuda-12.8/bin:$PATH", SKBUILD_CMAKE_DEFINE = "VIDLO_FFMPEG_ROOT=/opt/ffmpeg;VIDLO_NVSDK_ROOT=/opt/nvsdk;VIDLO_CVCUDA_ROOT=/opt/cvcuda" }
repair-wheel-command = "LD_LIBRARY_PATH=/opt/ffmpeg/lib:/opt/cvcuda/lib auditwheel repair --exclude libcuda.so.1 --exclude libnvcuvid.so.1 -w {dest_dir} {wheel}"
