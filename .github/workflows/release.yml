name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # 手动触发只构建、不发布，用来在打 tag 前试跑

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      # 设置在 pyproject.toml 的 [tool.cibuildwheel]：Python 3.11～3.14，manylinux_2_28
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        with:
          output-dir: dist

      - name: Build sdist
        run: pipx run build --sdist --outdir dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
