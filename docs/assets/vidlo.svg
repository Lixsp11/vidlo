<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="vidlo">
  <title>vidlo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- three frames stacked back to front -->
  <rect x="38" y="20" width="68" height="46" rx="8" fill="#5eead4" opacity="0.35"/>
  <rect x="30" y="32" width="68" height="46" rx="8" fill="#5eead4" opacity="0.65"/>
  <rect x="22" y="44" width="68" height="46" rx="8" fill="#ccfbf1"/>
  <!-- film perforations on the front frame -->
  <g fill="#134e4a" opacity="0.55">
    <rect x="30" y="49" width="6" height="4" rx="1"/>
    <rect x="42" y="49" width="6" height="4" rx="1"/>
    <rect x="54" y="49" width="6" height="4" rx="1"/>
    <rect x="66" y="49" width="6" height="4" rx="1"/>
    <rect x="78" y="49" width="6" height="4" rx="1"/>
    <rect x="30" y="81" width="6" height="4" rx="1"/>
    <rect x="42" y="81" width="6" height="4" rx="1"/>
    <rect x="54" y="81" width="6" height="4" rx="1"/>
    <rect x="66" y="81" width="6" height="4" rx="1"/>
    <rect x="78" y="81" width="6" height="4" rx="1"/>
  </g>
  <!-- play mark -->
  <path d="M50 58.5 L66 67 L50 75.5 Z" fill="#0f766e"/>
  <!-- frames flowing out: arrow under the stack -->
  <path d="M96 84 v18 m-7 -7 l7 7 l7 -7" fill="none" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
